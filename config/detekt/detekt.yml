# Minimal, deliberate detekt config for FaceAlbum.
#
# This is NOT a dump of every rule. `buildUponDefaultConfig: true` (set in
# app/build.gradle.kts) means detekt's own default rule set is the baseline,
# and everything below is an explicit, commented override. Anything not
# listed here — including the checks we specifically want, like
# SwallowedException, TooGenericExceptionCaught, EmptyFunctionBlock, the
# unused-code rules (UnusedPrivateMember, UnusedImports, ...), and
# ForEachOnRange — stays active at detekt's default settings.
#
# Status: landed in report-only mode. `ignoreFailures = true` is set on the
# Detekt Gradle task (app/build.gradle.kts), so nothing here can turn CI red.
# This is the first time detekt has run against this codebase's real source,
# straight off three red CI runs — the plan is to land the tooling, read what
# a real run actually reports, and tighten (raise thresholds, promote genuine
# findings to build-breaking, maybe add a baseline file) in a follow-up once
# the signal/noise ratio is known. Tracked in ROADMAP.md, Phase 0.

style:
  FunctionNaming:
    active: false
    # Composable functions are PascalCase by Jetpack Compose convention
    # (`ProfileCard`, not `profileCard`) — as written, this rule flags every
    # single @Composable function in the app. Not a naming problem to fix.
  MagicNumber:
    active: false
    # UI code is dense with legitimate dp/sp/alpha/color literals. The thing
    # this rule is meant to catch — an unexplained constant buried in logic —
    # is a rare exception here, and real hits would be lost in noise.

complexity:
  LongParameterList:
    active: false
    # State-hoisted Compose screen composables routinely take 15+ parameters
    # by design — each piece of hoisted state and each event callback is its
    # own parameter. That's idiomatic Compose in this codebase, not a smell.
