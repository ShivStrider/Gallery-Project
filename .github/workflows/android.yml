name: Android CI

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Logs must never carry media identifiers (photo URIs, album/person
      # names, file names) — only stable numeric IDs and enum names. This
      # guard greps every Timber call for the usual leak patterns.
      - name: Check logs for media identifiers
        run: |
          if grep -rnE 'Timber\.[a-z]+\(.*(\.uri|albumName|displayName|\.name\b)' app/src/main/java/; then
            echo "::error::Timber call logs a media identifier (URI / album / display name). Log IDs instead."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Dump failing test reports
        if: failure()
        run: |
          echo "=== Failed test summaries ==="
          find app/build/test-results -name 'TEST-*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -l '<failure\|<error' \
            | while read -r f; do
                echo "----- $f -----"
                cat "$f"
              done

      - name: Run lint
        run: ./gradlew lint --stacktrace

      # Assembling the debug APK and compiling the androidTest source set are
      # the only CI-side proof that the app and its instrumentation tests
      # actually build — `test` + `lint` alone never compile either.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Room exports schema JSON during the build. They must be committed
      # (MigrationTestHelper reads them), so surface them for retrieval when
      # a new DB version is added.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
