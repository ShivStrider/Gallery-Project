name: Android CI

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

# A push to a branch that has an open PR fires this workflow twice on the very
# same commit — once for `push`, once for `pull_request`. Both jobs then race
# on the shared Gradle cache, and one can die seconds in having produced no
# compiler output at all, putting a spurious red on the PR while the identical
# commit passes in the sibling run. That happened on ce292a1.
#
# Grouping by commit SHA collapses both events into a single run: the two
# events yield the same SHA, so the later one supersedes the earlier instead of
# competing with it. Also halves CI minutes on every push to a branch with a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Logs must never carry media identifiers (photo URIs, album/person
      # names, file names) — only stable numeric IDs and enum names. This
      # guard greps every Timber call for the usual leak patterns.
      - name: Check logs for media identifiers
        run: |
          if grep -rnE 'Timber\.[a-z]+\(.*(\.uri|albumName|displayName|\.name\b)' app/src/main/java/; then
            echo "::error::Timber call logs a media identifier (URI / album / display name). Log IDs instead."
            exit 1
          fi

      # Tee'd to a file so the final Result summary step can echo the compiler
      # errors back out at the end of the job. A compile failure produces no
      # test XML at all, and the errors themselves land hundreds of lines deep
      # in a log the API only serves from the tail — which made the last two
      # compile breaks far more expensive to diagnose than to fix.
      # pipefail is required or tee would mask gradle's exit status.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee /tmp/gradle-test.log

      # Always print per-suite counts. A green conclusion only proves nothing
      # *ran and failed* — a suite that silently stops running (a filtered
      # class, or one that fails to initialise) is invisible otherwise, and
      # the safety suites are exactly where that must not go unnoticed.
      - name: Test summary
        if: always()
        run: |
          # Suites run under both the debug and release unit-test variants, so
          # the same class appears twice. Deduplicate by suite line before
          # counting — a total that silently doubles is worse than none.
          find app/build/test-results -name 'TEST-*.xml' 2>/dev/null \
            | xargs -r sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/\1 \2 \3 \4 \5/p' \
            | sort -u > /tmp/suite-counts.txt
          echo "=== Per-suite test counts (deduplicated across variants) ==="
          awk '{print $1": tests="$2" skipped="$3" failures="$4" errors="$5}' /tmp/suite-counts.txt
          echo "=== Totals ==="
          awk '{t+=$2; s+=$3; f+=$4; e+=$5} END {print "suites="NR" tests="t" skipped="s" failures="f" errors="e}' \
            /tmp/suite-counts.txt

      - name: Benchmark output
        if: always()
        run: |
          # The clustering benchmarks print their measured timings to stdout,
          # which Gradle captures into the JUnit XML rather than the console.
          # Surface just those lines so the numbers can be read off a green run
          # without downloading the test-results artifact — docs/plan/
          # 07-performance-plan.md is filled in from here.
          find app/build/test-results -name 'TEST-com.facealbum.perf.*.xml' 2>/dev/null \
            | xargs -r grep -ho '\[\(assign\|mergeClose\|generator\)\].*' \
            | sort -u \
            || echo "No benchmark output found."

      - name: Dump failing test reports
        if: failure()
        run: |
          echo "=== Failed test summaries ==="
          find app/build/test-results -name 'TEST-*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -l '<failure\|<error' \
            | while read -r f; do
                echo "----- $f -----"
                cat "$f"
              done

      - name: Run lint
        run: ./gradlew lint --stacktrace

      # Assembling the debug APK and compiling the androidTest source set are
      # the only CI-side proof that the app and its instrumentation tests
      # actually build — `test` + `lint` alone never compile either.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Room exports schema JSON during the build. They must be committed
      # (MigrationTestHelper reads them from assets), so surface them for
      # retrieval when a new DB version is added.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      # The build regenerates app/schemas/. If that differs from what's
      # committed, the migration tests are validating against a stale schema —
      # which is exactly how a hand-written migration silently drifts from its
      # entities. Print the diff and fail rather than let it pass unnoticed.
      - name: Check Room schemas are committed and current
        if: always()
        run: |
          if ! git diff --quiet --exit-code -- app/schemas/; then
            echo "::error::Generated Room schemas differ from the committed ones. Commit the regenerated app/schemas/ files."
            git diff -- app/schemas/
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard app/schemas/)" ]; then
            echo "::error::A generated Room schema is not committed:"
            git ls-files --others --exclude-standard app/schemas/
            exit 1
          fi
          echo "Room schemas are committed and match the build output."

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Repeated verbatim as the LAST step on purpose. The same summary runs
      # earlier, right after the tests, but the lint and assemble output that
      # follows buries it hundreds of lines deep — and the GitHub API only
      # exposes job logs from the tail, while the raw log blob sits behind a
      # host the agent proxy blocks. Printing it again at the very end means a
      # short tail always reaches the numbers.
      - name: Result summary (repeated at end of job for log-tail access)
        if: always()
        run: |
          echo "=== Per-suite test counts (deduplicated across variants) ==="
          find app/build/test-results -name 'TEST-*.xml' 2>/dev/null \
            | xargs -r sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/\1 \2 \3 \4 \5/p' \
            | sort -u > /tmp/suite-counts-final.txt
          awk '{print $1": tests="$2" skipped="$3" failures="$4" errors="$5}' /tmp/suite-counts-final.txt
          echo "=== Totals ==="
          awk '{t+=$2; s+=$3; f+=$4; e+=$5} END {print "suites="NR" tests="t" skipped="s" failures="f" errors="e}' \
            /tmp/suite-counts-final.txt
          echo "=== Benchmark output ==="
          find app/build/test-results -name 'TEST-com.facealbum.perf.*.xml' 2>/dev/null \
            | xargs -r grep -ho '\[\(assign\|mergeClose\|generator\)\].*' \
            | sort -u \
            || echo "No benchmark output found."

          # suites=0 means the tests never ran — almost always a compile error,
          # not a test failure. Say so loudly and surface the actual compiler
          # errors here at the end of the job, where a short log tail reaches
          # them, instead of leaving them buried in the gradle step above.
          if [ ! -s /tmp/suite-counts-final.txt ]; then
            echo "=== NO TEST XML PRODUCED — the tests never ran ==="
            echo "This is the compile-error signature, not a test failure."
            if [ -f /tmp/gradle-test.log ]; then
              echo "--- compiler / gradle errors ---"
              grep -E '^e: |FAILURE: |What went wrong|Execution failed for task|Caused by: ' \
                /tmp/gradle-test.log | head -60
            else
              echo "(no gradle log captured)"
            fi
          fi
