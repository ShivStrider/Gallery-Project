name: Android CI

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Logs must never carry media identifiers (photo URIs, album/person
      # names, file names) — only stable numeric IDs and enum names. This
      # guard greps every Timber call for the usual leak patterns.
      - name: Check logs for media identifiers
        run: |
          if grep -rnE 'Timber\.[a-z]+\(.*(\.uri|albumName|displayName|\.name\b)' app/src/main/java/; then
            echo "::error::Timber call logs a media identifier (URI / album / display name). Log IDs instead."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Always print per-suite counts. A green conclusion only proves nothing
      # *ran and failed* — a suite that silently stops running (a filtered
      # class, or one that fails to initialise) is invisible otherwise, and
      # the safety suites are exactly where that must not go unnoticed.
      - name: Test summary
        if: always()
        run: |
          echo "=== Per-suite test counts ==="
          find app/build/test-results -name 'TEST-*.xml' 2>/dev/null | sort | while read -r f; do
            sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/\1: tests=\2 skipped=\3 failures=\4 errors=\5/p' "$f"
          done
          echo "=== Totals ==="
          find app/build/test-results -name 'TEST-*.xml' 2>/dev/null \
            | xargs -r sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)"[^>]*failures="\([0-9]*\)"[^>]*errors="\([0-9]*\)".*/\1 \2 \3/p' \
            | awk '{t+=$1; f+=$2; e+=$3} END {print "tests="t" failures="f" errors="e}'

      - name: Dump failing test reports
        if: failure()
        run: |
          echo "=== Failed test summaries ==="
          find app/build/test-results -name 'TEST-*.xml' -print0 2>/dev/null \
            | xargs -0 -r grep -l '<failure\|<error' \
            | while read -r f; do
                echo "----- $f -----"
                cat "$f"
              done

      - name: Run lint
        run: ./gradlew lint --stacktrace

      # Assembling the debug APK and compiling the androidTest source set are
      # the only CI-side proof that the app and its instrumentation tests
      # actually build — `test` + `lint` alone never compile either.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Room exports schema JSON during the build. They must be committed
      # (MigrationTestHelper reads them from assets), so surface them for
      # retrieval when a new DB version is added.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      # The build regenerates app/schemas/. If that differs from what's
      # committed, the migration tests are validating against a stale schema —
      # which is exactly how a hand-written migration silently drifts from its
      # entities. Print the diff and fail rather than let it pass unnoticed.
      - name: Check Room schemas are committed and current
        if: always()
        run: |
          if ! git diff --quiet --exit-code -- app/schemas/; then
            echo "::error::Generated Room schemas differ from the committed ones. Commit the regenerated app/schemas/ files."
            git diff -- app/schemas/
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard app/schemas/)" ]; then
            echo "::error::A generated Room schema is not committed:"
            git ls-files --others --exclude-standard app/schemas/
            exit 1
          fi
          echo "Room schemas are committed and match the build output."

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
