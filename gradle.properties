org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# SHA-256 of app/src/main/assets/mobile_face_net.tflite, checked by the
# verifyFaceModelPresent Gradle task before release builds. Left empty
# because this repo does not ship the model asset (see INSTALL.md) and so has
# no real checksum to pin; an empty value makes the task pass with a warning
# instead of failing. Once you've sourced a model, compute this yourself
# (`sha256sum app/src/main/assets/mobile_face_net.tflite`) and set it here, or
# pass it per-build with -PfaceModelSha256=<hex>. Never fill this in with a
# value you have not personally verified.
faceModelSha256=
